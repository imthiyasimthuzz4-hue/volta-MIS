<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expenses | VOLTA MIS</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-mark small-mark">V</span><span>VOLTA<small>Electrical Associates</small></span></div><nav><a  th:href="@{/dashboard}">Dashboard</a><a  th:href="@{/customers}">Customers</a><a  th:href="@{/projects}">Projects</a><a  th:href="@{/staff}">Staff</a><a  th:href="@{/materials}">Materials</a><a class="active" th:href="@{/expenses}">Expenses</a><a  th:href="@{/reports}">Reports</a></nav><form th:action="@{/logout}" method="post"><button class="logout" type="submit">Sign out</button></form></aside><main class="main"><header class="topbar"><div><p class="eyebrow">VOLTA MIS</p><h1>Expenses</h1></div><span class="status"><i></i> System workspace</span></header><div class="success" th:if="${message}" th:text="${message}"></div><section class="panel"><h3 th:text="${editing} ? 'Edit expense' : 'Record an expense'">Record an expense</h3><form class="form-grid" th:action="@{/expenses/save}" th:object="${expense}" method="post"><input type="hidden" th:field="*{id}"><label>Description *<input th:field="*{description}" required maxlength="200"></label><label>Category<input th:field="*{category}" maxlength="100" placeholder="Fuel, purchase, salary..."></label><label>Amount (₹) *<input type="number" min="0.01" step="0.01" th:field="*{amount}" required></label><label>Expense date<input type="date" th:field="*{expenseDate}"></label><label>Paid to<input th:field="*{paidTo}" maxlength="150"></label><label>Payment method<select th:field="*{paymentMethod}"><option value="">Select</option><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Cheque</option><option>Card</option></select></label><div class="form-actions"><button class="primary" type="submit" th:text="${editing} ? 'Update expense' : 'Save expense'">Save expense</button><a class="button-link" th:if="${editing}" th:href="@{/expenses}">Cancel</a></div></form></section><section class="panel"><div class="panel-heading"><h3>Expense list</h3><span class="count" th:text="${expenses.size()} + ' records'">0 records</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Paid to</th><th>Payment</th><th>Amount (₹)</th><th>Action</th></tr></thead><tbody><tr th:each="e : ${expenses}"><td th:text="${e.expenseDate}"></td><td class="strong" th:text="${e.description}"></td><td th:text="${e.category}"></td><td th:text="${e.paidTo}"></td><td th:text="${e.paymentMethod}"></td><td th:text="${e.amount}"></td><td><a class="button-link" th:href="@{/expenses/edit/{id}(id=${e.id})}">Edit</a> <form style="display:inline" th:action="@{/expenses/delete/{id}(id=${e.id})}" method="post" onsubmit="return confirm('Delete this expense?')"><button class="danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(expenses)}"><td colspan="7" class="empty">No expenses recorded yet.</td></tr></tbody></table></div></section><p class="footer-note"><a th:href="@{/dashboard}">← Back to dashboard</a></p></main></div></body></html>
