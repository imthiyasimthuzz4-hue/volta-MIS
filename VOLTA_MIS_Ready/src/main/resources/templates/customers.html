<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | VOLTA MIS</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-mark small-mark">V</span><span>VOLTA<small>Electrical Associates</small></span></div><nav><a th:href="@{/dashboard}">Dashboard</a><a class="active" th:href="@{/customers}">Customers</a><a th:href="@{/projects}">Projects</a><a th:href="@{/staff}">Staff</a><a th:href="@{/materials}">Materials</a><a th:href="@{/expenses}">Expenses</a><a th:href="@{/reports}">Reports</a></nav><form th:action="@{/logout}" method="post"><button class="logout" type="submit">Sign out</button></form></aside><main class="main"><header class="topbar"><div><p class="eyebrow">CUSTOMER MANAGEMENT</p><h1>Customers</h1></div><a class="button-link" href="#add-customer">＋ Add customer</a></header><div class="success" th:if="${message}" th:text="${message}"></div><section class="panel" id="add-customer"><h3>Add a customer</h3><form class="form-grid" th:action="@{/customers/save}" th:object="${customer}" method="post"><label>Customer name *<input th:field="*{name}" required maxlength="120"></label><label>Phone<input th:field="*{phone}" maxlength="30"></label><label>Email<input type="email" th:field="*{email}" maxlength="150"></label><label>Address<input th:field="*{address}" maxlength="250"></label><div class="form-actions"><button class="primary" type="submit">Save customer</button></div></form></section><section class="panel"><div class="panel-heading"><h3>Customer list</h3><span class="count" th:text="${customers.size()} + ' records'">0 records</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Action</th></tr></thead><tbody><tr th:each="c : ${customers}"><td class="strong" th:text="${c.name}">Name</td><td th:text="${c.phone}">Phone</td><td th:text="${c.email}">Email</td><td th:text="${c.address}">Address</td><td><form th:action="@{/customers/delete/{id}(id=${c.id})}" method="post" onsubmit="return confirm('Delete this customer?')"><button class="danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="5" class="empty">No customers yet. Add the first customer above.</td></tr></tbody></table></div></section><p class="footer-note"><a th:href="@{/dashboard}">← Back to dashboard</a></p></main></div></body></html>
