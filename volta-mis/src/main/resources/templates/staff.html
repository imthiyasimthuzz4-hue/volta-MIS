<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff | VOLTA MIS</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-mark small-mark">V</span><span>VOLTA<small>Electrical Associates</small></span></div><nav><a  th:href="@{/dashboard}">Dashboard</a><a  th:href="@{/customers}">Customers</a><a  th:href="@{/projects}">Projects</a><a class="active" th:href="@{/staff}">Staff</a><a  th:href="@{/materials}">Materials</a><a  th:href="@{/expenses}">Expenses</a><a  th:href="@{/reports}">Reports</a></nav><form th:action="@{/logout}" method="post"><button class="logout" type="submit">Sign out</button></form></aside><main class="main"><header class="topbar"><div><p class="eyebrow">STAFF MANAGEMENT</p><h1>Staff</h1></div><a class="button-link" href="#entry">＋ Add staff</a></header><div class="success" th:if="${message}" th:text="${message}"></div><section class="panel" id="entry"><h3>Enter staff details</h3><form class="form-grid" th:action="@{/staff/save}" th:object="${staff}" method="post"><label>Full name *<input th:field="*{fullName}" required maxlength="120"></label><label>Phone<input th:field="*{phone}" maxlength="30"></label><label>Job title<input th:field="*{jobTitle}" maxlength="100"></label><label>Email<input type="email" th:field="*{email}" maxlength="150"></label><label>Monthly salary (₹)<input type="number" min="0" step="0.01" th:field="*{salary}"></label><label>Status<select th:field="*{status}"><option>ACTIVE</option><option>INACTIVE</option></select></label><div class="form-actions"><button class="primary" type="submit">Save staff</button></div></form></section><section class="panel"><div class="panel-heading"><h3>Staff list</h3><span class="count" th:text="${records.size()} + ' records'">0 records</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Job title</th><th>Email</th><th>Salary (₹)</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="s : ${records}"><td class="strong" th:text="${s.fullName}"></td><td th:text="${s.phone}"></td><td th:text="${s.jobTitle}"></td><td th:text="${s.email}"></td><td th:text="${s.salary}"></td><td th:text="${s.status}"></td><td><form th:action="@{/Staff/delete/{id}(id=${s.id})}" method="post" onsubmit="return confirm('Delete this record?')"><button class="danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="10" class="empty">No records yet. Add the first record above.</td></tr></tbody></table></div></section><p class="footer-note"><a th:href="@{/dashboard}">← Back to dashboard</a></p></main></div></body></html>
