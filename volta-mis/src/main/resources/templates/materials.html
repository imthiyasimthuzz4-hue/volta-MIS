<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materials | VOLTA MIS</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="brand-mark small-mark">V</span><span>VOLTA<small>Electrical Associates</small></span></div><nav><a  th:href="@{/dashboard}">Dashboard</a><a  th:href="@{/customers}">Customers</a><a  th:href="@{/projects}">Projects</a><a  th:href="@{/staff}">Staff</a><a class="active" th:href="@{/materials}">Materials</a><a  th:href="@{/expenses}">Expenses</a><a  th:href="@{/reports}">Reports</a></nav><form th:action="@{/logout}" method="post"><button class="logout" type="submit">Sign out</button></form></aside><main class="main"><header class="topbar"><div><p class="eyebrow">INVENTORY MANAGEMENT</p><h1>Materials</h1></div><a class="button-link" href="#entry">＋ Add material</a></header><div class="success" th:if="${message}" th:text="${message}"></div><section class="panel" id="entry"><h3>Enter material details</h3><form class="form-grid" th:action="@{/materials/save}" th:object="${material}" method="post"><label>Item name *<input th:field="*{itemName}" required maxlength="150"></label><label>Item code<input th:field="*{itemCode}" maxlength="80"></label><label>Unit<input th:field="*{unit}" placeholder="pcs, metre, box"></label><label>Quantity in stock<input type="number" min="0" th:field="*{quantity}"></label><label>Unit price (₹)<input type="number" min="0" step="0.01" th:field="*{unitPrice}"></label><label>Supplier<input th:field="*{supplier}" maxlength="150"></label><div class="form-actions"><button class="primary" type="submit">Save material</button></div></form></section><section class="panel"><div class="panel-heading"><h3>Materials list</h3><span class="count" th:text="${records.size()} + ' records'">0 records</span></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Code</th><th>Unit</th><th>Quantity</th><th>Unit price (₹)</th><th>Supplier</th><th>Action</th></tr></thead><tbody><tr th:each="m : ${records}"><td class="strong" th:text="${m.itemName}"></td><td th:text="${m.itemCode}"></td><td th:text="${m.unit}"></td><td th:text="${m.quantity}"></td><td th:text="${m.unitPrice}"></td><td th:text="${m.supplier}"></td><td><form th:action="@{/Materials/delete/{id}(id=${m.id})}" method="post" onsubmit="return confirm('Delete this record?')"><button class="danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(records)}"><td colspan="10" class="empty">No records yet. Add the first record above.</td></tr></tbody></table></div></section><p class="footer-note"><a th:href="@{/dashboard}">← Back to dashboard</a></p></main></div></body></html>
