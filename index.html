<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://volta-mis-app.onrender.com">
  <title>VOLTA MIS | Electrical Associates</title>
  <link rel="icon" type="image/png" href="src/main/resources/static/images/favicon.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 10% 10%, #172a4d, #0b1528 85%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 36px 30px;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; margin: 0 0 8px; letter-spacing: 0.5px; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; }
    .btn {
      display: inline-block;
      background: #003366;
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s;
    }
  </style>
  <script>
    window.location.replace("https://volta-mis-app.onrender.com" + window.location.pathname + window.location.search);
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>VOLTA ELECTRICAL ASSOCIATES</h2>
    <p>Connecting to secure enterprise cloud server...</p>
    <a class="btn" href="https://volta-mis-app.onrender.com">Open VOLTA MIS Now &rarr;</a>
  </div>
</body>
</html>
