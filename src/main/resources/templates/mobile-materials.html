<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Godown Material Stock | VOLTA Electrical Associates</title>
  <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#003366">

  <style>
    :root {
      --primary: #003366;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: #0f172a; padding-bottom: 75px; }

    .top-bar {
      background: var(--primary);
      color: #fff;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .back-btn { color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; }
    .top-title { font-size: 16px; font-weight: 800; }

    .search-box {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 53px;
      z-index: 40;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .container { padding: 14px 16px; }

    .stock-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mat-name { font-size: 14px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .mat-sub { font-size: 11.5px; color: #64748b; }
    .qty-badge {
      text-align: right;
    }
    .qty-val { font-size: 16px; font-weight: 800; color: #16a34a; }
    .qty-low { color: #dc2626; }
    .qty-unit { font-size: 11px; color: #64748b; font-weight: 600; }
  </style>
</head>
<body>

  <header class="top-bar">
    <a th:href="@{/mobile}" class="back-btn">← Home</a>
    <h2 class="top-title">📦 Godown Inventory</h2>
    <span style="font-size:12px; color:#ffcc00; font-weight:700;">LIVE</span>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search cables, switches, pipes..." class="search-input" onkeyup="filterStock()">
  </div>

  <div class="container" id="stockList">
    <div class="stock-card" th:each="m : ${materials}">
      <div>
        <div class="mat-name" th:text="${m.name}">Material Name</div>
        <div class="mat-sub">
          <span th:text="${m.category}">Category</span> •
          <span th:text="'HSN: ' + ${m.hsnSac}">HSN</span> •
          <span th:text="'Rate: ₹' + ${m.unitPrice}">Rate</span>
        </div>
      </div>
      <div class="qty-badge">
        <div class="qty-val" th:classappend="${m.quantity <= m.minAlertQty} ? 'qty-low' : ''" th:text="${m.quantity}">0</div>
        <div class="qty-unit" th:text="${m.unit}">Nos</div>
      </div>
    </div>
  </div>

  <script>
    function filterStock() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.stock-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
