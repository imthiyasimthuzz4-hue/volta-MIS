spring.application.name=VOLTA MIS
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Cloud and Local Datasource Configuration (MySQL, PostgreSQL, or H2)
spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/volta_mis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Volta@2026}}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Configurable Upload Directory (for Docker Volumes and Cloud Disks)
volta.upload.dir=${UPLOAD_DIR:uploads}
