name: Keep VOLTA MIS Warm 24/7 (Eliminate Render Cold Start & Promotion)

on:
  schedule:
    # Ping every 10 minutes so Render never sleeps after 15 minutes of inactivity
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VOLTA MIS Cloud Service
        run: |
          echo "Pinging VOLTA MIS on Render..."
          curl -s -f https://volta-mis-app.onrender.com/login > /dev/null || true
          curl -s -f https://voltamis.vercel.app > /dev/null || true
          echo "Keep-alive ping successful. App is active and warm!"
