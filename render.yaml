services:
  - type: web
    name: volta-mis-app
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: "8080"
      - key: UPLOAD_DIR
        value: "/app/uploads"
      - key: JPA_DDL_AUTO
        value: "update"

