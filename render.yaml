services:
  - type: web
    name: volta-electrical-associates
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # 100% Free Plan ($0.00/mo)
    region: singapore # Closest region to Kerala / India (Fastest response)
    branch: main
    numInstances: 1
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 8080
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: JPA_DDL_AUTO
        value: update

