spring.application.name=VOLTA MIS
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volta_mis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_THIS_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.thymeleaf.cache=false
server.error.include-message=always
